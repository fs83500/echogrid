[package]
name = "echogrid"
version = "1.4.0"
description = "EchoGrid - Cross-platform visual multi-ping monitor"
authors = ["EchoGrid"]
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
surge-ping = "0.8"
chrono = "0.4"
tauri-plugin-notification = "2"
dirs = "5"

[build-dependencies]
tauri-build = { version = "2", features = [] }
